techpack:
  name: fullstack-typescript
  namespace: fs-ts
  description: >
    Production-ready fullstack TypeScript stack. Node.js backends
    with CMDO architecture, React frontends with MVVM, PostgreSQL
    databases, OpenAPI contracts with generated types, Kubernetes
    deployment via Helm, and CI/CD through GitHub Actions.
  version: "0.1.0"
  min_sdd_version: "0.1.0"
  system_path: ./system/system-run.sh

# ──────────────────────────────────────────────────────────────
# Skill registry — name → path (relative to techpack root).
# Agents reference skills by name; core resolves to path here.
# ──────────────────────────────────────────────────────────────
skills:

  # Component standards
  backend-standards: skills/components/backend/backend-standards/SKILL.md
  frontend-standards: skills/components/frontend/frontend-standards/SKILL.md
  database-standards: skills/components/database/database-standards/SKILL.md
  contract-standards: skills/components/contract/contract-standards/SKILL.md
  helm-standards: skills/components/helm/helm-standards/SKILL.md
  config-standards: skills/components/config/config-standards/SKILL.md
  cicd-standards: skills/components/cicd/cicd-standards/SKILL.md
  integration-testing-standards: skills/components/integration-testing/integration-testing-standards/SKILL.md
  e2e-testing-standards: skills/components/e2e-testing/e2e-testing-standards/SKILL.md
  typescript-standards: skills/typescript-standards/SKILL.md
  unit-testing: skills/unit-testing/SKILL.md
  postgresql: skills/components/database/postgresql/SKILL.md

  # Phase skills
  speccing-standards: skills/speccing-standards/SKILL.md
  component-discovery: skills/component-discovery/SKILL.md
  scaffolding: skills/scaffolding/SKILL.md
  planning-standards: skills/planning-standards/SKILL.md

  # Help skills
  capabilities: skills/capabilities/SKILL.md
  help-content: skills/help-content/SKILL.md

  # Settings skill (loaded by agents for component metadata)
  techpack-settings: skills/techpack-settings/SKILL.md

  # Orchestration skills (used by commands with handler: skill)
  config-orchestration: skills/orchestrators/config-orchestration/SKILL.md
  local-env-orchestration: skills/orchestrators/local-env-orchestration/SKILL.md

  # Scaffolding skills
  config-scaffolding: skills/components/config/config-scaffolding/SKILL.md
  contract-scaffolding: skills/components/contract/contract-scaffolding/SKILL.md
  database-scaffolding: skills/components/database/database-scaffolding/SKILL.md
  backend-scaffolding: skills/components/backend/backend-scaffolding/SKILL.md
  frontend-scaffolding: skills/components/frontend/frontend-scaffolding/SKILL.md
  helm-scaffolding: skills/components/helm/helm-scaffolding/SKILL.md
  integration-testing-scaffolding: skills/components/integration-testing/integration-testing-scaffolding/SKILL.md
  e2e-testing-scaffolding: skills/components/e2e-testing/e2e-testing-scaffolding/SKILL.md
  cicd-scaffolding: skills/components/cicd/cicd-scaffolding/SKILL.md


# ──────────────────────────────────────────────────────────────
# Agent registry — name → path (relative to techpack root).
# Components and phases reference agents by name.
# ──────────────────────────────────────────────────────────────
agents:
  api-designer: agents/api-designer.md
  backend-dev: agents/backend-dev.md
  db-advisor: agents/db-advisor.md
  frontend-dev: agents/frontend-dev.md
  devops: agents/devops.md
  tester: agents/tester.md
  reviewer: agents/reviewer.md

# ──────────────────────────────────────────────────────────────
# Components — what this techpack can build.
# singleton: true = one instance, false = multiple named instances.
# agent is required for implementation-phase components,
# optional for command-driven components (e.g., config).
# ──────────────────────────────────────────────────────────────
components:

  config:
    singleton: true
    description: >
      Centralized YAML configuration for the project. Mandatory singleton
      that all other components read from. Generates environment-specific
      config files from a single source of truth.
    directory_pattern: components/config/
    depends_on: []
    scaffolding: config-scaffolding
    skills: [config-standards]

  contract:
    singleton: false
    description: >
      OpenAPI 3.x specifications that define the API surface between
      frontend and backend. Generates TypeScript types, request/response
      validators, and API client code from the spec.
    directory_pattern: "components/contracts/{name}/"
    depends_on: [config]
    scaffolding: contract-scaffolding
    skills: [contract-standards, typescript-standards]
    agent: api-designer

  database:
    singleton: false
    description: >
      PostgreSQL database with versioned migrations, seed data, and
      a data access layer. Manages schema evolution through sequential
      migration files and provides typed query functions.
    directory_pattern: "components/databases/{name}/"
    depends_on: [config]
    scaffolding: database-scaffolding
    skills: [database-standards]
    agent: db-advisor

  server:
    singleton: false
    description: >
      Node.js/TypeScript backend following CMDO architecture
      (Controller → Model → DAL → Orchestrator). Exposes HTTP APIs
      defined by contracts, connects to databases, and runs
      background workers.
    directory_pattern: "components/servers/{name}/"
    depends_on: [contract, config, database]
    scaffolding: backend-scaffolding
    skills: [backend-standards, typescript-standards]
    agent: backend-dev

  webapp:
    singleton: false
    description: >
      React/TypeScript frontend following MVVM architecture
      (View → ViewModel → Model). Consumes contracts for type-safe
      API calls via TanStack Query and renders UI with a component
      library.
    directory_pattern: "components/webapps/{name}/"
    depends_on: [contract]
    scaffolding: frontend-scaffolding
    skills: [frontend-standards, typescript-standards]
    agent: frontend-dev

  helm:
    singleton: false
    description: >
      Kubernetes Helm charts that package servers and webapps for
      deployment. Defines services, deployments, ingress rules,
      config maps, and secrets. Supports local dev (minikube/kind)
      and production clusters.
    directory_pattern: "components/helm_charts/{name}/"
    depends_on: [server, webapp]
    scaffolding: helm-scaffolding
    skills: [helm-standards]
    agent: devops

  integration-testing:
    singleton: false
    description: >
      Integration test suites that verify component interactions
      against real dependencies (databases, APIs). Runs via Vitest
      with Testkube for Kubernetes-native execution.
    directory_pattern: "components/testing/integration/{name}/"
    depends_on: [contract, server, database, helm]
    scaffolding: integration-testing-scaffolding
    skills: [integration-testing-standards]
    agent: tester

  e2e-testing:
    singleton: false
    description: >
      End-to-end test suites that verify complete user workflows
      through the browser. Runs via Playwright with Testkube for
      Kubernetes-native execution against a running stack.
    directory_pattern: "components/testing/e2e/{name}/"
    depends_on: [server, webapp, database, helm]
    scaffolding: e2e-testing-scaffolding
    skills: [e2e-testing-standards]
    agent: tester

  cicd:
    singleton: false
    description: >
      CI/CD pipeline definitions for GitHub Actions. Automates
      build, test, lint, and deploy workflows. Depends on Helm
      charts for deployment stages.
    directory_pattern: "components/cicds/{name}/"
    depends_on: [helm]
    scaffolding: cicd-scaffolding
    skills: [cicd-standards]
    agent: devops


# ──────────────────────────────────────────────────────────────
# Phases — lifecycle hooks the techpack provides.
# Core defines which phases exist. Techpack declares what it
# contributes. Absent phase = core runs phase without techpack input.
#
# Lifecycle order: spec → planning → implementation → verification
# ──────────────────────────────────────────────────────────────
phases:
  spec:
    orchestrator_skills: [speccing-standards, component-discovery]

  planning:
    orchestrator_skills: [planning-standards]

  implementation:
    orchestrator_skills: [scaffolding]

  verification:
    orchestrator_skills: []
    agents: [reviewer, tester]

# ──────────────────────────────────────────────────────────────
# Help — techpack documentation loaded by /sdd-help and /sdd.
# capabilities: what this techpack can do (loaded by /sdd for intent mapping)
# content: detailed help and usage guidance (loaded by /sdd-help)
# ──────────────────────────────────────────────────────────────
help:
  capabilities: capabilities
  content: help-content

# ──────────────────────────────────────────────────────────────
# Commands — techpack CLI exposed via /sdd-run <namespace>.
#
# handler: system — route directly to techpack system CLI
# handler: skill  — load orchestration skill for LLM coordination
#
# All args, descriptions, and schemas are authoritative here.
# Core uses this for validation, help rendering, and dispatch
# without loading any skills.
# ──────────────────────────────────────────────────────────────
commands:

  config:
    handler: skill
    skill: config-orchestration
    actions:
      generate:
        description: "Generate merged config file for a target environment"
        public: false
        args:
          env:
            type: string
            mandatory: true
            description: "Target environment (e.g., local, staging, production)"
          component:
            type: string
            mandatory: false
            description: "Extract config for a single component"
          output:
            type: string
            mandatory: false
            description: "Write output to file path instead of stdout"
      validate:
        description: "Validate config files against JSON schema"
        public: false
        args:
          env:
            type: string
            mandatory: false
            description: "Validate a specific environment (default: all)"
      add-env:
        description: "Add a new environment configuration"
        public: true
        destructive: true
        args:
          env_name:
            type: string
            mandatory: true
            description: "Environment name (e.g., staging, production)"
      diff:
        description: "Show differences between two environment configs"
        public: true
        args:
          env_a:
            type: string
            mandatory: true
            description: "First environment to compare"
          env_b:
            type: string
            mandatory: true
            description: "Second environment to compare"

  contract:
    handler: system
    actions:
      generate-types:
        description: "Generate TypeScript types from OpenAPI spec"
        public: false
        args:
          name:
            type: string
            mandatory: true
            description: "Contract component name"
      validate:
        description: "Validate OpenAPI spec for correctness"
        public: false
        args:
          name:
            type: string
            mandatory: true
            description: "Contract component name"

  database:
    handler: system
    actions:
      setup:
        description: "Initialize database schema, run migrations, and seed"
        public: true
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"
      migrate:
        description: "Run pending database migrations"
        public: false
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"
      seed:
        description: "Populate database with seed data"
        public: false
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"
      reset:
        description: "Drop and recreate database from scratch"
        public: true
        destructive: true
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"
      teardown:
        description: "Remove database and all associated resources"
        public: true
        destructive: true
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"
      psql:
        description: "Open interactive PostgreSQL shell"
        public: true
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"
      port-forward:
        description: "Forward local port to database pod in Kubernetes"
        public: true
        args:
          name:
            type: string
            mandatory: true
            description: "Database component name"
          env:
            type: string
            mandatory: false
            description: "Target environment"

  local-env:
    handler: skill
    skill: local-env-orchestration
    actions:
      check-tools:
        description: "Verify required toolchain is installed (node, npm, kubectl, helm)"
        public: true
      create:
        description: "Create local Kubernetes cluster for development"
        public: true
      destroy:
        description: "Remove local Kubernetes cluster and all resources"
        public: true
        destructive: true
      start:
        description: "Start a stopped local Kubernetes cluster"
        public: true
      stop:
        description: "Stop the local Kubernetes cluster without destroying it"
        public: true
      status:
        description: "Show status of local cluster, pods, and services"
        public: true
      restart:
        description: "Restart the local Kubernetes cluster"
        public: true
      deploy:
        description: "Deploy application to Kubernetes via Helm charts"
        public: true
      undeploy:
        description: "Remove deployed application from Kubernetes"
        public: true
        destructive: true
      forward:
        description: "Forward local ports to running services"
        public: true
      config:
        description: "Show or update local environment configuration"
        public: true
      infra:
        description: "Manage infrastructure components (ingress, cert-manager)"
        public: true

  check-prerequisites:
    handler: system
    actions:
      run:
        description: "Verify required tools and prerequisites are installed (node, npm, git, kubectl, helm)"
        public: true
